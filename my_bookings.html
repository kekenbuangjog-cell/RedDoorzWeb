<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | RedDoorz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .booking-card { 
            border-radius: 20px; 
            border: none; 
            overflow: hidden; 
            transition: all 0.3s ease; 
            background: white;
        }
        .booking-card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1) !important; 
        }
        .hotel-img-list { 
            width: 180px; 
            height: 100%; 
            min-height: 180px;
            object-fit: cover; 
        }
        @media (max-width: 576px) { 
            .hotel-img-list { width: 100%; height: 200px; } 
        }
        
        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .nav-pills .nav-link.active {
            background-color: #E52D27;
            color: white;
            box-shadow: 0 4px 12px rgba(229, 45, 39, 0.3);
        }
        
        .date-block {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            min-width: 100px;
        }
        .date-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
            color: #adb5bd;
            display: block;
            margin-bottom: 2px;
        }
        .date-value {
            font-weight: 700;
            color: #212529;
        }
    </style>
</head>
<body class="bg-light" style="display: none;" id="main-body">

    <div id="navbar-placeholder"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">My Bookings</h2>
                    <ul class="nav nav-pills" id="bookingTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="active-tab" data-bs-toggle="pill" onclick="window.filterBookings('active')">Active</button>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="nav-link" id="history-tab" data-bs-toggle="pill" onclick="window.filterBookings('history')">History</button>
                        </li>
                    </ul>
                </div>

                <div id="alerts-container"></div>

                <div id="bookings-list-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-danger" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leave Review Modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Rate your stay</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="review-form">
                    <input type="hidden" name="bookingId" id="review-booking-id">
                    <input type="hidden" name="propId" id="review-prop-id">
                    <div class="modal-body p-4">
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Rating</label>
                            <select name="rating" class="form-select form-select-lg" required>
                                <option value="5">⭐⭐⭐⭐ stars (Excellent)</option>
                                <option value="4" selected>⭐⭐⭐⭐ stars (Good)</option>
                                <option value="3">⭐⭐⭐ stars (Average)</option>
                                <option value="2">⭐⭐ stars (Poor)</option>
                                <option value="1">⭐ star (Terrible)</option>
                            </select>
                        </div>
                        <div class="mb-0">
                            <label class="form-label small fw-bold">Comment (Optional)</label>
                            <textarea name="comment" class="form-control" rows="3" placeholder="Share your experience..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="review-submit-btn" class="btn btn-red px-4">Submit Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modals-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/my_bookings.js"></script>
</body>
</html>
