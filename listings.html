<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | RedDoorz</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/listings.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <form action="listings.html" method="GET" id="filterForm">
        <!-- Search Bar Sub-nav -->
        <div class="bg-white border-bottom py-3 mb-4">
            <div class="container">
                <div class="row g-2 justify-content-center">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="search" id="search-input" class="form-control border-start-0 ps-0" placeholder="Search by city, hotel name, or location...">
                            <button type="submit" class="btn btn-red px-4">Update Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mb-5">
            <div class="row">
                <!-- Filter Sidebar -->
                <div class="col-md-3 d-none d-md-block">
                    <div class="filter-sidebar">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0">Filter by</h5>
                            <a href="listings.html" class="text-danger small text-decoration-none">Clear All</a>
                        </div>
                        
                        <div class="mb-4">
                            <h6 class="fw-semibold">Price Range</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-checkbox" type="checkbox" name="price" value="0-1000" id="price1">
                                <label class="form-check-label" for="price1">PHP 0 - PHP 1,000</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-checkbox" type="checkbox" name="price" value="1000-2000" id="price2">
                                <label class="form-check-label" for="price2">PHP 1,000 - PHP 2,000</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-checkbox" type="checkbox" name="price" value="2000+" id="price3">
                                <label class="form-check-label" for="price3">PHP 2,000+</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-semibold">User Rating</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-checkbox" type="checkbox" name="rating" value="4" id="rate4">
                                <label class="form-check-label" for="rate4">4+ Stars</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input filter-checkbox" type="checkbox" name="rating" value="3" id="rate3">
                                <label class="form-check-label" for="rate3">3+ Stars</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Listings -->
                <div class="col-md-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">
                            <span id="hotelCount">0</span> Available Properties <span id="searchLocation" class="text-muted fs-6 fw-normal"></span>
                        </h4>
                        <select name="sort" id="sort-select" class="form-select w-auto">
                            <option value="popularity">Sort by: Popularity</option>
                            <option value="price_low">Price: Low to High</option>
                            <option value="price_high">Price: High to Low</option>
                        </select>
                    </div>

                    <div id="listings-container">
                        <!-- Listings will be injected here by JS -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div id="modals-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/listings.js"></script>
</body>
</html>
