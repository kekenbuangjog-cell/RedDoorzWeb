<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedDoorz | Book Affordable Hotels</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <!-- Floating Success Notification -->
    <div id="booking-success-container" class="position-fixed top-0 start-50 translate-middle-x mt-4 d-none" style="z-index: 9999;">
        <div class="bg-white text-dark px-4 py-3 rounded-pill shadow-lg d-flex align-items-center border">
            <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 32px; height: 32px;">
                <i class="bi bi-check-lg fw-bold"></i>
            </div>
            <div>
                <span class="fw-bold d-block" style="font-size: 0.9rem; line-height: 1;">Booking Confirmed</span>
                <small class="text-muted" id="success-message" style="font-size: 0.8rem;"></small>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="display-3 fw-bold mb-3">Your Journey Starts Here</h1>
            <p class="lead mb-0 opacity-75">Discover Cebu's most comfortable stays at unbeatable prices.</p>
        </div>
    </section>

    <!-- Search Bar -->
    <div class="container mb-5">
        <div class="search-container soft-shadow">
            <form action="listings.html" method="GET" class="row g-2 align-items-center">
                <div class="col">
                    <div class="input-group search-input-group">
                        <span class="input-group-text bg-white border-0 pe-0"><i class="bi bi-search text-muted fs-5"></i></span>
                        <input type="text" name="search" class="form-control border-0 ps-3 fs-5" placeholder="Where are you going?" required>
                    </div>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-red search-btn-circular">
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
                
                <div class="col-12 mt-2 px-3">
                    <div class="d-flex align-items-center flex-wrap gap-2" id="quick-search-container">
                        <small class="text-muted me-2">Available Cities:</small>
                        <div class="spinner-border spinner-border-sm text-muted" role="status"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Recommended Properties -->
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold h3 mb-0">Recommended for You</h2>
            <a href="listings.html" class="text-decoration-none text-danger fw-semibold">View all <i class="bi bi-arrow-right"></i></a>
        </div>
        
        <div class="row g-4" id="recommended-properties">
            <!-- Properties will be injected here by JS -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="modals-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
