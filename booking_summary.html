<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Summary | RedDoorz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .checkout-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .hotel-img-sm { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; }
        
        .sticky-summary {
            position: sticky;
            top: 100px;
        }
        
        .payment-method-card {
            border: 2px solid #f1f3f5;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            height: 100%;
        }
        .payment-method-card:hover {
            border-color: #dee2e6;
            background-color: #f8f9fa;
        }
        .payment-method-card.active {
            border-color: #E52D27;
            background-color: #fff5f5;
        }
        .payment-icon {
            font-size: 1.5rem;
            margin-right: 12px;
            color: #495057;
        }
        .payment-method-card.active .payment-icon {
            color: #E52D27;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .price-total {
            border-top: 1px solid #dee2e6;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 1.25rem;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-light">

    <div id="navbar-placeholder"></div>

    <div class="container my-5">
        <div class="row g-4" id="summary-view">
            <!-- Content will be injected by JS -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="modals-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/booking_summary.js"></script>
</body>
</html>
